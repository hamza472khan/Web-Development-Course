<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-wrapper">
    <form id="loginForm" class="login-card" novalidate>
      <h1 class="logo">Netflex</h1>
      <p class="lead">Sign in to your account</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com" aria-describedby="emailError">
        <small class="error" id="emailError"></small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="6" placeholder="Minimum 6 characters" aria-describedby="passwordError">
        <small class="error" id="passwordError"></small>
      </div>

      <div class="options">
        <label class="show"><input id="showPassword" type="checkbox"> Show password</label>
        <label class="remember"><input id="remember" type="checkbox"> Remember me</label>
      </div>

      <button type="submit" class="btn">Sign In</button>

      <div class="links">
        <a href="#">Forgot password?</a>
        <a href="#">Create account</a>
      </div>

      <div id="success" class="success" aria-live="polite" hidden>Login successful (demo only)</div>
    </form>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
